# The Xcode project is generated from this file: run `App/bootstrap.sh` after cloning, pulling or editing
# it (it runs XcodeGen). Ackshually.xcodeproj is git-ignored: never edit it by hand, change this file.
name: Ackshually
options:
  minimumXcodeGenVersion: 2.48.0
  bundleIdPrefix: app.ackshually
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  AckshuallyCore:
    path: ../Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ackshually:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: AckshuallyCore
    # Server URL and the bundled app token (from the git-ignored Config/Secrets.xcconfig, optional).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: ackshually
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Hold the mic to ask a rules question out loud.
        NSSpeechRecognitionUsageDescription: Your spoken question is transcribed so it can be sent to the rules referee.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        AckshuallyServerURL: $(ACKSHUALLY_SERVER_URL)
        AckshuallyAppToken: $(ACKSHUALLY_APP_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ackshually.viewer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  AckshuallyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Ackshually
      # Already linked into the host app: import it, don't link a second copy.
      - package: AckshuallyCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ackshually.viewer.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  AckshuallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ackshually
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ackshually.viewer.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ackshually
schemes:
  Ackshually:
    build:
      targets:
        Ackshually: all
        AckshuallyTests: [test]
        AckshuallyUITests: [test]
    # Test plans (App/TestPlans): Full is the default; see "Which tests when" in CLAUDE.md.
    test:
      targets: [AckshuallyTests, AckshuallyUITests]
      testPlans:
        - path: TestPlans/Full.xctestplan
          defaultPlan: true
        - path: TestPlans/Unit.xctestplan
        - path: TestPlans/Smoke.xctestplan
        - path: TestPlans/Viewer.xctestplan
        - path: TestPlans/AnswerSheet.xctestplan
        - path: TestPlans/Library.xctestplan
        - path: TestPlans/Server.xctestplan
