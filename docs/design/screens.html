<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ackshually screens</title>
<style>
  body{font-family:var(--font-sans,-apple-system,system-ui,sans-serif);color:var(--foreground,#e5e5e5)}
  .intro{font-size:12px;color:var(--muted-foreground,#999);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 16px;align-items:start}
  .item h3{margin:0 0 1px;font-size:13.5px}
  .item .ms{font-size:10px;color:var(--muted-foreground,#999);margin-bottom:8px}
  .item ul{margin:6px 0 0;padding-left:16px;font-size:11px;color:var(--muted-foreground,#aaa)}
  .item li{margin:2px 0}.item li b{color:var(--foreground,#eee);font-weight:600}

  /* ---- app tokens: warm palette, one font (SF) ---- */
  .phone{--bg:#efe4d0;--paper:#fbf5e9;--ink:#33261b;--muted:#8a735c;--line:#d8c6a8;--sheet:#f4e9d5;--card:#fffaf0;--accent:#a2412b;--accent-ink:#fff7ec;
    --hl:rgba(242,177,52,.42);--hlb:#d39320;--ok-bg:#e3efd9;--ok:#3f6b2a;--warn:#a2412b;
    width:206px;height:340px;margin:0 auto;border:7px solid #1c1c1e;border-radius:32px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);
    font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:10px;line-height:1.38}
  .notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:58px;height:15px;border-radius:9px;background:#1c1c1e;z-index:20}
  .status{position:absolute;top:6px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:8.5px;font-weight:600;z-index:19}
  .nav{position:absolute;top:26px;left:0;right:0;height:26px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;z-index:4;background:var(--bg)}
  .nav b{font-size:11.5px}.a{color:var(--accent)}
  .page{position:absolute;inset:52px 0 0;padding:12px 13px;background:var(--paper);color:#2a2a2a;font-family:Georgia,serif;font-size:8.5px}
  .page h5{margin:0 0 6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#5a4a3a}
  .page p{margin:0 0 6px;color:#555}
  .fig{height:50px;border-radius:4px;background:repeating-linear-gradient(45deg,#ddd 0 6px,#e8e8e8 6px 12px);margin:6px 0}
  .hl{background:var(--hl);box-shadow:0 0 0 1.5px var(--hlb);border-radius:3px;padding:2px 3px;color:#1a1a1a}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:7px 0 10px;box-shadow:0 -6px 20px rgba(0,0,0,.18);z-index:5}
  .grab{width:32px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 7px}
  .head{padding:0 11px}
  .rq{font-size:9px;color:var(--muted);margin-bottom:3px}
  .verdict{font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.02em}
  .meta{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 8px}
  .chip{font-size:8px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--ok-bg);color:var(--ok)}
  .chip.alt{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
  .rail{display:flex;gap:7px;padding-left:11px;overflow:hidden}
  .rail.mid{padding-left:0;margin-left:-156px}
  .card{flex:0 0 160px;background:var(--card);border-radius:11px;padding:8px 9px;box-shadow:0 1px 0 var(--line);min-height:58px}
  .card.peek{opacity:.6}
  .card .h{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-bottom:3px}
  .card .h b{color:var(--ink)}
  .card.web{box-shadow:inset 0 0 0 1px var(--line)}
  .warnl{font-size:8.5px;font-weight:700;color:var(--warn);margin-bottom:2px}
  .dots{display:flex;gap:4px;justify-content:center;margin-top:8px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:12px;border-radius:3px}
  .fb{display:flex;gap:6px;margin-top:6px}.fb span{flex:1;text-align:center;padding:4px 0;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);font-size:11px}
  .ask{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:20px;background:var(--card);box-shadow:0 1px 0 var(--line);color:var(--muted);font-size:9.5px;z-index:6}
  .mic{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:10px;flex:none}
  .follow{margin:6px 11px 0;padding:5px 6px 5px 9px;border-radius:16px;background:var(--bg);color:var(--muted);font-size:9px;display:flex;align-items:center}
  .follow .mic{width:18px;height:18px;font-size:8px}
  .btn{display:inline-block;font-size:9.5px;font-weight:600;padding:5px 12px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
  .btn.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  /* home & lists */
  .home{position:absolute;inset:26px 0 0;padding:6px 12px}
  .logo{font-weight:700;font-size:21px;letter-spacing:-.03em;margin:6px 0 2px}
  .tag{font-size:9px;color:var(--muted);margin-bottom:10px}
  .game{display:flex;gap:8px;align-items:center;padding:7px;border-radius:12px;background:var(--card);margin-bottom:7px;box-shadow:0 1px 0 var(--line);position:relative}
  .cover{width:30px;height:38px;border-radius:5px;flex:none}
  .game b{font-size:11px;display:block}.game span{font-size:8.5px;color:var(--muted)}
  .prog{height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}.prog i{display:block;height:100%;width:62%;background:var(--accent)}
  .swipeacts{position:absolute;right:0;top:0;bottom:0;display:flex;border-radius:0 12px 12px 0;overflow:hidden}
  .swipeacts span{display:grid;place-items:center;padding:0 9px;font-size:9px;font-weight:600;color:#fff}
  .sect{font-size:8.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 5px}
  .qrow{padding:7px 8px;border-radius:10px;background:var(--card);margin-bottom:6px;box-shadow:0 1px 0 var(--line)}
  .qrow div:last-child{color:var(--muted);font-size:8.5px;margin-top:1px}
  /* misc */
  .skel{height:9px;border-radius:4px;background:linear-gradient(90deg,var(--line),#e9dcc4,var(--line));margin:5px 0}
  .pill{position:absolute;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;padding:4px 10px;border-radius:12px;background:var(--ink);color:var(--paper);z-index:6;white-space:nowrap}
  .dim{position:absolute;inset:0;background:rgba(40,25,10,.35);z-index:10}
  .modal{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:16px 16px 0 0;padding:8px 11px 14px;z-index:11}
  .opts span{display:inline-block;font-size:8.5px;padding:3px 7px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);margin:3px 3px 0 0}
  .opts span.on{background:var(--ink);color:var(--paper);box-shadow:none}
  .note{margin-top:7px;padding:6px 8px;border-radius:8px;background:var(--card);color:var(--muted)}
  .steprow{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:9px;background:var(--card);margin-bottom:5px}
  .steprow.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .steprow span{color:var(--muted);font-size:8.5px}
  .wave{display:flex;gap:2px;align-items:center;height:14px}.wave i{display:block;width:2px;background:var(--accent);border-radius:1px}
  .gest{position:absolute;font-size:8.5px;padding:2px 7px;border-radius:8px;background:#3b82f6;color:#fff;z-index:30;white-space:nowrap;font-family:-apple-system,system-ui,sans-serif}
  .tap{position:absolute;width:28px;height:28px;border-radius:50%;border:2px dashed #3b82f6;z-index:30}
</style></head><body>
<p class="intro">Chosen style, v2 answer sheet. Placeholder rule text. <span style="color:#3b82f6">Blue tags / dashed circles</span> mark gestures.</p>
<div class="grid" id="grid"></div>

<script>
const chrome = (title, right='⋯') => `<div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <div class="nav"><span class="a">‹ Games</span><b>${title}</b><span class="a">${right}</span></div>`;
const pageGeneral = `<div class="page"><h5>5 · Bureaucracy</h5><p>Players earn money for each city they power this round.</p>
  <p><span class="hl"><b>End of turn:</b> discard all unused energy</span> back to the supply.</p><p>Resources stored on plants are not affected.</p><div class="fig"></div></div>`;
const pageBattery = (hl=true) => `<div class="page"><h5>7 · Items</h5><p>Items are bought during phase 3 and stay in front of you.</p>
  <p>${hl?'<span class="hl">':''}<b>Battery:</b> at end of turn, you may keep up to 2 unused energy.${hl?'</span>':''}</p><p>Only one Battery per player. Items cannot be traded.</p><div class="fig"></div><p>See also: Phase 4, Resources.</p></div>`;
const head = `<div class="head"><div class="rq">3 energy + a Battery, at end of turn</div>
  <div class="verdict">Keep 2 energy, discard 1.</div>
  <div class="meta"><span class="chip">✓ Stated · p.12, p.14</span><span class="chip alt">No Battery? Discard 3 ›</span></div></div>`;
const c1 = (peek)=>`<div class="card${peek?' peek':''}"><div class="h"><b>1 · General rule</b><span>p.12</span></div>Unused energy is discarded at end of turn.</div>`;
const c2 = (peek)=>`<div class="card${peek?' peek':''}"><div class="h"><b>2 · Exception</b><span>p.14</span></div>The Battery keeps up to 2 unused energy, overriding the discard.</div>`;
const c3 = (peek)=>`<div class="card${peek?' peek':''}"><div class="h"><b>3 · Result</b></div>2 stay on the Battery, 1 goes back.${peek?'':'<div class="fb"><span>👍</span><span>👎</span></div>'}</div>`;
const dots = n => `<div class="dots">${[0,1,2].map(i=>`<i${i===n?' class="on"':''}></i>`).join('')}</div>`;
const covers = ['#3a6ea5','#c9572b','#2f8f83','#b8892b'];

const S = [
 {t:'1 · My Games', ms:'Home · M3 (M2 opens the last PDF)', li:['<b>Tap a game</b> → viewer, resumes last session','<b>＋</b> → file picker / share-sheet import','<b>Swipe left</b> → Export · Delete'],
  h:`<div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="home">
   <div class="logo">ackshually</div><div class="tag">Well, according to p.14…</div>
   <div class="game"><div class="cover" style="background:${covers[0]}"></div><div><b>Power Grid</b><span>3 sessions · Nov 14</span></div></div>
   <div class="game"><div class="cover" style="background:${covers[1]}"></div><div style="flex:1"><b>Root — Law of Root</b><span>Preparing…</span><div class="prog"><i></i></div></div></div>
   <div class="game" style="padding-right:92px"><div class="cover" style="background:${covers[2]}"></div><div><b>Azul</b><span>1 session</span></div><div class="swipeacts"><span style="background:#8a735c">Export</span><span style="background:#a2412b">Delete</span></div></div>
   <div class="game"><div class="cover" style="background:${covers[3]}"></div><div><b>Dune Imperium</b><span>No sessions yet</span></div></div>
   </div><div class="ask">Add a rulebook PDF<span class="mic">＋</span></div>
   <div class="gest" style="top:250px;left:56px">← swipe</div>`},

 {t:'2 · New game, preparing', ms:'M2 basic · M3 background OCR', li:['PDF <b>readable instantly</b>','Asking is <b>never blocked</b>','Status line only if pages need OCR'],
  h:`${chrome('Azul')}<div class="page"><h5>Overview</h5><p>Introduced by the Moors, azulejos were tile works…</p><div class="fig" style="height:90px"></div><p>Players take turns drafting tiles from the factory displays…</p></div>
   <div style="position:absolute;left:12px;right:12px;bottom:52px;z-index:6;font-size:8.5px;color:var(--muted);display:flex;align-items:center;gap:6px"><span style="flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden"><i style="display:block;width:38%;height:100%;background:var(--accent)"></i></span>Reading scanned pages 3/8</div>
   <div class="ask">Ask about the rules…<span class="mic">🎙</span></div>`},

 {t:'3 · Ask: hold to talk', ms:'Viewer idle · M2', li:['<b>Hold 🎙</b>: live transcript, <b>release</b> sends','<b>Slide left</b> cancels','<b>Tap 🎙</b>: dictation, edit before sending'],
  h:`${chrome('Power Grid')}${pageGeneral.replace('<span class="hl">','<span>')}
   <div class="ask" style="flex-direction:column;align-items:stretch;gap:5px;padding:8px 8px 8px 10px;border-radius:16px;color:var(--ink)">
    <div>“what happens to my energy at end of turn if I have the batt…”</div>
    <div style="display:flex;align-items:center;gap:8px;color:var(--muted)"><span>‹ slide to cancel</span><div class="wave" style="margin-left:auto"><i style="height:4px"></i><i style="height:10px"></i><i style="height:14px"></i><i style="height:7px"></i><i style="height:11px"></i><i style="height:5px"></i></div><span class="mic" style="margin-left:0;transform:scale(1.25)">🎙</span></div></div>
   <div class="tap" style="bottom:12px;right:9px"></div><div class="gest" style="bottom:72px;right:8px">hold</div>`},

 {t:'4 · Answer arriving (t≈1s)', ms:'Streaming · M2', li:['<b>Restated question</b> first','Wrong? <b>Stop</b> and rephrase right away','Verdict streams in next'],
  h:`${chrome('Power Grid')}${pageGeneral.replace('<span class="hl">','<span>')}
   <div class="sheet"><div class="grab"></div><div class="head">
    <div class="rq">You asked</div><div style="font-size:11px;font-weight:600;margin-bottom:8px">3 energy + a Battery, at end of turn</div>
    <div class="skel" style="width:85%;height:13px"></div><div class="skel" style="width:45%"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="color:var(--muted)">Reading the rulebook…</span><span class="btn g">■ Stop</span></div></div></div>
   <div class="tap" style="bottom:4px;right:14px;width:44px"></div>`},

 {t:'5 · Verdict + step 1 (t≈5s)', ms:'Sheet · M2', li:['Fixed <b>answer header</b>: verdict, confidence, branch','<b>Step card</b> below; PDF jumps + highlights','Peeking card = <b>swipe or tap</b> for next'],
  h:`${chrome('Power Grid')}${pageGeneral}<div class="sheet"><div class="grab"></div>${head}
   <div class="rail">${c1()}${c2(true)}</div>${dots(0)}</div>
   <div class="gest" style="bottom:50px;right:6px">← swipe or tap</div>`},

 {t:'6 · Step 2', ms:'Sheet · M2', li:['Header <b>never changes</b> while stepping','PDF <b>follows the card</b>: page turn + zoom','<b>Swipe right</b> / tap left peek = back'],
  h:`${chrome('Power Grid')}${pageBattery()}<div class="sheet"><div class="grab"></div>${head}
   <div class="rail mid">${c1(true)}${c2()}${c3(true)}</div>${dots(1)}</div>
   <div class="gest" style="top:150px;left:50%;transform:translateX(-50%)">page follows the card</div>`},

 {t:'7 · Show the skeptic', ms:'Sheet collapsed · M2', li:['<b>Drag sheet down</b>: page near full-screen','Verdict stays pinned as one line','Drag up to restore'],
  h:`${chrome('Power Grid')}${pageBattery()}
   <div class="sheet" style="padding:7px 11px 12px"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:11.5px">Keep 2 energy, discard 1.</b><span class="chip" style="font-size:7.5px;white-space:nowrap">✓ p.14</span></div></div>
   <div class="gest" style="bottom:52px;left:50%;transform:translateX(-50%)">drag down ↓</div>`},

 {t:'8 · Inspect freely', ms:'M2', li:['<b>Pinch / pan</b> anytime','<b>Back to step</b> pill re-centers the highlight','<b>Double-tap</b>: evidence ↔ full page'],
  h:`${chrome('Power Grid')}<div class="page" style="padding-top:20px"><p>…Phase 3: buy resources in reverse order.</p><h5>7 · Items</h5><p>Items are bought during phase 3 and stay in front of you.</p><p><span class="hl"><b>Battery:</b> at end of turn…</span></p></div>
   <div class="pill" style="bottom:192px">⤺ Back to step 2</div>
   <div class="sheet"><div class="grab"></div>${head}<div class="rail mid">${c1(true)}${c2()}${c3(true)}</div></div>
   <div class="gest" style="top:120px;right:14px">pinch / pan</div>`},

 {t:'9 · Full answer', ms:'Sheet expanded · M2', li:['<b>Drag up</b>: everything about the answer','<b>Tap a step</b> → jump to it','<b>Tap the branch</b> → its own step cards'],
  h:`${chrome('Power Grid')}${pageBattery()}
   <div class="sheet" style="top:48px"><div class="grab"></div>${head}
    <div class="head"><div class="sect" style="margin-top:2px">Steps</div>
     <div class="steprow"><div>1 · General rule</div><span>p.12</span></div>
     <div class="steprow on"><div>2 · Exception</div><span>p.14</span></div>
     <div class="steprow"><div>3 · Result</div><span></span></div>
     <div class="sect">Assumes</div><div style="color:var(--muted)">The Battery is already in play.</div></div></div>
   <div class="gest" style="top:52px;right:10px">drag up ↑</div>`},

 {t:'10 · Not covered → web', ms:'M4', li:['Auto when <b>Not covered / Inferred</b>','Web source = a <b>labeled card</b>, never a PDF highlight','Conflict: rulebook leads, <b>⚠ Designer disagrees</b>'],
  h:`${chrome('Root')}<div class="page"><h5>4.2 · Battle</h5><p>The attacker chooses a clearing where they have warriors or pieces.</p><p><span class="hl">4.2.1 The defender may ambush…</span></p><p>Rolls are resolved with the higher die going to the attacker.</p></div>
   <div class="sheet"><div class="grab"></div><div class="head"><div class="rq">Can the Vagabond move after battling?</div>
    <div class="verdict">Probably yes; the Law doesn't say.</div>
    <div class="meta"><span class="chip alt">? Not covered · closest 4.2</span></div></div>
    <div class="rail mid">${'<div class="card peek"><div class="h"><b>1 · Closest rule</b><span>4.2</span></div>…</div>'}
     <div class="card web"><div class="warnl">⚠ Designer disagrees</div><div class="h"><span>🌐 bgg.com · 2021</span><span>↗</span></div>“Yes, as long as he has boots.”</div>
     <div class="card peek"><div class="h"><b>3</b></div>…</div></div>${dots(1)}</div>`},

 {t:'11 · 👎 feedback', ms:'Last card · M3', li:['<b>👍</b> saved silently','<b>👎</b>: one-tap reason, optional step + note','⋯ → <b>Export game</b> as JSON'],
  h:`${chrome('Power Grid')}${pageBattery()}<div class="dim"></div>
   <div class="modal"><div class="grab"></div><b style="font-size:11.5px">What was wrong?</b>
    <div class="opts" style="margin-top:4px"><span>Wrong verdict</span><span>Missed exception</span><span class="on">Wrong highlight</span><span>Wrong page</span><span>Too slow</span><span>Other</span></div>
    <div style="margin-top:7px;color:var(--muted)">Which step? <span class="opts"><span>1</span><span class="on">2</span><span>3</span></span></div>
    <div class="note">Note (optional)…</div>
    <div style="text-align:right;margin-top:8px"><span class="btn">Send</span></div></div>`},

 {t:'12 · Sessions', ms:'⋯ → Sessions · M3', li:['<b>Tap a question</b> → reopens it at step 1','<b>New</b> = new game night, clears context'],
  h:`<div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div>
   <div class="nav"><span class="a">‹ Power Grid</span><b>Sessions</b><span class="a">New</span></div>
   <div class="home" style="top:52px">
    <div class="sect">Tonight</div>
    <div class="qrow"><div>Energy with a Battery at end of turn?</div><div>Keep 2, discard 1 · 👍</div></div>
    <div class="qrow"><div>Can I buy a plant I can't power?</div><div>Yes, but you must discard one · 👎</div></div>
    <div class="sect">Nov 14</div>
    <div class="qrow"><div>When does step 3 start?</div><div>When the Step 3 card is drawn</div></div>
    <div class="qrow"><div>Ties in turn order?</div><div>Highest plant number goes first</div></div></div>
   <div class="tap" style="top:24px;right:2px;width:34px"></div>`}
];
document.getElementById('grid').innerHTML = S.map((s,i)=>`<div class="item" id="s${i+1}"><h3>${s.t}</h3><div class="ms">${s.ms}</div><div class="phone">${s.h}</div><ul>${s.li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
</script>
</body></html>
